workflows:
  android-release:
    name: PipisTerminal Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        SERIOUS_PYTHON_VERSION: "3.13"
    scripts:
      - name: Prepare Flutter Android project
        script: |
          flutter create --platforms=android --org com.pipis.pipisterminal .
          # The generated default test assumes a MyApp widget and a counter demo,
          # neither of which exists in PipisTerminal.
          rm -f test/widget_test.dart
      - name: Configure Android minimum SDK
        script: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              path = Path(filename)
              if path.exists():
                  text = path.read_text()
                  text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
                  text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
                  path.write_text(text)
          PY
      - name: Get Flutter packages
        script: flutter pub get
      - name: Package embedded Python
        script: |
          export SERIOUS_PYTHON_SITE_PACKAGES="$CM_BUILD_DIR/build/site-packages"
          export SERIOUS_PYTHON_APP="$CM_BUILD_DIR/build/app"
          dart run serious_python:main package app/src -p Android
      - name: Analyze
        script: flutter analyze
      - name: Build APK
        script: |
          export SERIOUS_PYTHON_SITE_PACKAGES="$CM_BUILD_DIR/build/site-packages"
          export SERIOUS_PYTHON_APP="$CM_BUILD_DIR/build/app"
          flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
