name: pipis_terminal
description: PipisTerminal, a local Python coding terminal for Android.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^9.2.3
  http: ^1.5.0
  path_provider: ^2.1.5
  serious_python: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
