name: Build PipisTerminal APK

on:
  push:
    branches:
      - pipisedit-file-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.pipis.pipisterminal .
          # Flutter generates a counter-app test that references the nonexistent MyApp.
          rm -f test/widget_test.dart

      - name: Allow local Python bridge over loopback HTTP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          if 'android:usesCleartextTraffic=' in content:
              content = re.sub(
                  r'android:usesCleartextTraffic="[^"]*"',
                  'android:usesCleartextTraffic="true"',
                  content,
              )
          else:
              content = content.replace(
                  '<application',
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
          manifest.write_text(content)
          PY

      - name: Set PipisTerminal launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path

          res = Path('android/app/src/main/res')
          (res / 'drawable').mkdir(parents=True, exist_ok=True)
          (res / 'mipmap-anydpi-v26').mkdir(parents=True, exist_ok=True)

          (res / 'drawable/ic_launcher_background.xml').write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FF21132E" android:pathData="M0,0h108v108h-108z" />
          </vector>''')

          (res / 'drawable/ic_launcher_foreground.xml').write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#FFB56BFF"
                  android:strokeWidth="7" android:strokeLineCap="round"
                  android:strokeLineJoin="round" android:pathData="M30,34 L51,54 L30,74" />
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="7" android:strokeLineCap="round"
                  android:pathData="M59,73 L79,73" />
          </vector>''')

          (res / 'mipmap-anydpi-v26/ic_launcher.xml').write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>''')
          PY

      - name: Set Android SDK versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for filename in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              path = Path(filename)
              if path.exists():
                  content = path.read_text()
                  # serious_python_android requires compileSdk 36; file_picker's
                  # Android lifecycle dependency enforces the same minimum.
                  content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                  content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
                  content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
                  content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
                  path.write_text(content)
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Package embedded Python
        env:
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
          SERIOUS_PYTHON_APP: ${{ github.workspace }}/build/app
        run: dart run serious_python:main package app/src -p Android

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APKs
        env:
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
          SERIOUS_PYTHON_APP: ${{ github.workspace }}/build/app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PipisTerminal-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
